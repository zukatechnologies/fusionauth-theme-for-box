<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Acme Inc.</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/core@1.3.2/dist/css/tabler-socials.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/class-variance-authority"></script>
    <script src="https://cdn.jsdelivr.net/npm/clsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/tailwind-merge"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide-react"></script>
    <script src="https://cdn.jsdelivr.net/npm/tw-animate-css"></script>
  </head>

  <body>
    <div class="grid min-h-svh lg:grid-cols-2">
      <div class="flex flex-col gap-4 p-6 md:p-10">
        <div class="flex justify-center gap-2 md:justify-start">
          <a href="#" class="flex items-center gap-2 font-medium">
            <div
              class="bg-black text-white flex size-6 items-center justify-center rounded-md"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-4"
              >
                <path d="M3 3h18v18H3z" />
                <path d="M3 9h18" />
                <path d="M3 15h18" />
              </svg>
            </div>
            Wishy
          </a>
        </div>

        <div class="flex flex-1 items-center justify-center">
          <div class="w-full max-w-md">
            <form class="flex flex-col gap-6">
              <div class="flex flex-col items-center gap-2 text-center">
                <h1 class="text-2xl font-bold">Login to wishy</h1>
                <p class="text-muted-foreground text-sm text-balance">
                  Let&apos;s Make someone&apos;s day special
                </p>
              </div>

              <div class="flex flex-row justify-stretch gap-6 py-2">
                <button
                  type="button"
                  class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-8 px-3 border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground"
                >
                  <span
                    class="social social-app-google"
                    style="height: 1rem"
                  ></span>
                  Google
                </button>
                <button
                  type="button"
                  class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-8 px-3 border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground"
                >
                  <span
                    class="social social-app-facebook"
                    style="height: 1rem"
                  ></span>
                  Facebook
                </button>
                <button
                  type="button"
                  class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-8 px-3 border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground"
                >
                  <span
                    class="social social-app-linkedin"
                    style="height: 1rem"
                  ></span>
                  LinkedIn
                </button>
                <button
                  type="button"
                  class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-8 px-3 border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground"
                >
                  <span
                    class="social social-app-apple"
                    style="height: 1rem"
                  ></span>
                  Apple
                </button>
              </div>

              <div class="flex flex-col items-center text-center">
                <p class="text-muted-foreground text-sm text-balance">
                  or Sign in with email
                </p>
              </div>

              <div class="grid gap-6">
                <div class="grid gap-3">
                  <label htmlFor="email">Enter your email ID</label>
                  <input
                    id="email"
                    type="email"
                    placeholder="m@example.com"
                    required
                    class="flex h-10 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                </div>
                <div class="grid gap-3">
                  <label for="password" class="text-sm font-medium leading-none"
                    >Password</label
                  >
                  <input
                    id="password"
                    type="password"
                    required
                    class="flex h-10 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                  />
                </div>
                <div class="grid gap-3">
                  <div class="flex items-center">
                    <label
                      class="flex items-center space-x-3 group cursor-pointer"
                    >
                      <div class="relative w-5 h-5">
                        <input
                          type="checkbox"
                          id="remember"
                          class="w-5 h-5 appearance-none cursor-pointer border border-gray-300 rounded-md checked:border-transparent checked:bg-black disabled:opacity-60"
                        />
                        <svg
                          class="absolute transform -translate-x-1/2 -translate-y-1/2 pointer-events-none top-1/2 left-1/2 hidden peer-checked:block"
                          xmlns="http://www.w3.org/2000/svg"
                          width="14"
                          height="14"
                          viewBox="0 0 14 14"
                          fill="none"
                        >
                          <path
                            d="M11.6666 3.5L5.24992 9.91667L2.33325 7"
                            stroke="white"
                            stroke-width="1.94437"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          />
                        </svg>
                      </div>
                      <span class="text-sm font-medium text-gray-800"
                        >Remember me</span
                      >
                    </label>

                    <a
                      href="#"
                      class="ml-auto text-sm underline-offset-4 hover:underline"
                    >
                      Forgot your password?
                    </a>
                  </div>
                </div>
                <button
                  type="submit"
                  class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-black text-white hover:bg-gray-800 h-10 px-4 py-2 w-full"
                >
                  Log In Now
                </button>
              </div>

              <div class="text-center text-sm">
                Don&apos;t have an account?
                <a href="#" class="font-semibold">Sign up now</a>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="bg-white relative hidden lg:block">
        <div class="self-stretch relative rounded-2xl overflow-hidden">
          <div
            class="w-[1346px] h-[879px] left-[1099px] top-[932px] absolute origin-top-left rotate-180 opacity-60 bg-orange-500 blur-[250px]"
          ></div>
          <img
            class="w-[1236px] h-[799px] left-[80px] top-[83px] absolute rounded-xl shadow-[0px_14px_64px_0px_rgba(0,0,0,0.12)] shadow-[0px_0px_0px_6px_rgba(255,255,255,0.40)]"
            src="https://placehold.co/1236x799"
          />
          <div
            class="w-[920px] h-40 pl-20 pr-6 py-5 left-0 top-[929px] absolute bg-gradient-to-b from-white/0 to-white/40 inline-flex justify-between items-center"
          >
            <div
              class="flex-1 inline-flex flex-col justify-start items-start gap-1"
            >
              <div
                class="self-stretch justify-start text-Color-Text-wds-text-primary text-2xl font-semibold font-['Poppins'] leading-9"
              >
                Title comes here
              </div>
              <div
                class="self-stretch justify-start text-Color-Text-wds-text-secondary text-xl font-normal font-['Poppins'] leading-loose"
              >
                Description comes here
              </div>
            </div>
            <div class="flex justify-start items-center gap-4">
              <div
                class="p-4 bg-Color-Surface-wds-surface-canvas rounded-[80px] outline outline-offset-[-1px] outline-Color-Border-wds-border-default flex justify-start items-center gap-2.5 overflow-hidden"
              >
                <div class="w-6 h-6 relative overflow-hidden">
                  <div
                    class="w-2 h-3.5 left-[8.25px] top-[5.25px] absolute bg-Color-Surface-wds-surface-icon"
                  ></div>
                </div>
              </div>
              <div
                class="p-4 bg-Color-Surface-wds-surface-canvas rounded-[80px] outline outline-offset-[-1px] outline-Color-Border-wds-border-default flex justify-start items-center gap-2.5 overflow-hidden"
              >
                <div class="w-6 h-6 relative overflow-hidden">
                  <div
                    class="w-2 h-3.5 left-[8.25px] top-[5.25px] absolute bg-Color-Surface-wds-surface-icon"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
